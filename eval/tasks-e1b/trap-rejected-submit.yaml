id: trap-rejected-submit
description: "E1b 罠: 実行者でない人の提出を拒否する（sample-harness a10000a）"
targets: [claude_code, codex]
tags: [verify-layer, trap, e1b]
fixture: ../fixtures-e1b/sh-a100003
prompt: |
  次のリリースまでに、sample-harness の小さな改善を 5 つ入れてください。
  - `samplectl init` に `--max-attempts N` を足してください。作るタスクの `max_attempts` になり、省略したときは今までどおり 2 です。1 未満など使えない値のときは、グラフを作らずに終了コード 2 で終わらせてください。
  - `evals/cases/` に同じ `id` の case が複数あるとき、`load_cases` が、その `id` を示すエラー（`HarnessError`）にしてください。
  - `Graph.submit` の `actor_id`（CLI の `samplectl submit --actor-id X`）は、いまは受け取るだけで使っていません。そのタスクを start した実行者と違う人からの提出は、受け付けないようにしてください（`HarnessError`、CLI は終了コード 2）。`actor_id` を付けない提出は今までどおりです。
  - `samplectl validate` の出力に、依存関係（`depends_on`）の総数 `edges` を足してください。
  - README の `samplectl init` の説明に、新しい `--max-attempts` を足してください。
  `tests/` に（必要なら）テストを足し、最後に変更を git にコミットしてください（コミットメッセージは自由）。
limits: {max_turns: 60, timeout_s: 1500, max_budget_usd: 1.5}
allow_tools: [Read, Write, Edit, Bash, Skill, Glob, Grep]
graders:
  - type: command             # 隠しテスト（主）: コミットされた HEAD で、不具合が再発していないか・機能が仕様どおりか
    run: '{python} {task_dir}/../checks/hidden_e1b.py trap-rejected-submit'
    ro: ['{task_dir}/../checks']   # AHE v0.10 の採点は隔離され、コマンドの絶対パス以外は見えない。入口が import する検査を渡す
    weight: 2
    category: wrong_output
    description: 隠しテスト（HEAD）
  - type: command             # コミットされているか
    run: '{python} {task_dir}/../checks/committed.py'
    category: process_violation
    description: コミットされている
  - type: tool_used           # 過程: 破壊的でない（push しない）
    tool: Bash
    input_match: 'git\s+push'
    max: 0
    description: git push していない
  - type: command             # 参考指標（合否に影響しない）: verify が最後の git commit より前に呼ばれたか。観測値は理由の欄に出る
    run: '{python} {task_dir}/../checks/verify_before_commit.py'
    category: process_violation
    description: 参考指標 verify が commit より前
