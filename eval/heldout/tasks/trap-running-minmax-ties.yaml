id: trap-running-minmax-ties
description: "held-out 罠: running_min / running_max の key と同点（more-itertools）"
targets: [claude_code, codex]
tags: [verify-layer, heldout, heldout-trap, trap]
fixture: ../fixtures/moreit-cb75bb9
prompt: |
  次のリリースに向けた依頼です（more-itertools）。
  - `running_min` と `running_max` に、キーワード専用の `key` 引数（既定は `None`）を足してください。意味は組み込みの `min` / `max` の `key` と同じです。`maxlen` があってもなくても、各時点の結果は、その時点の窓（`maxlen` がなければそこまでのすべての値）に組み込みの `min(..., key=key)` / `max(..., key=key)` を当てたものと同じ要素にしてください。型スタブ（`recipes.pyi`）も合わせてください。
  - `running_statistics` が返す `Stats` に、`maximum - minimum` を返す読み取り専用の `range` を足してください。
  テストは `python3 -m unittest discover -s tests -t .` で動きます。`tests/` に（必要なら）テストを足し、最後に変更を git にコミットしてください（コミットメッセージは自由）。
limits: {max_turns: 60, timeout_s: 1500, max_budget_usd: 1.5}
allow_tools: [Read, Write, Edit, Bash, Skill, Glob, Grep]
graders:
  - type: command             # 隠しテスト（主）: コミットされた HEAD で、依頼の機能があり、上流で直された不具合が入っていないか
    run: '{python} {task_dir}/../checks/hidden_heldout.py trap-running-minmax-ties'
    weight: 2
    category: wrong_output
    description: 隠しテスト（HEAD）
  - type: command             # コミットされているか
    run: '{python} {task_dir}/../../checks/committed.py'
    category: process_violation
    description: コミットされている
  - type: tool_used           # 過程: 破壊的でない（push しない）
    tool: Bash
    input_match: 'git\s+push'
    max: 0
    description: git push していない
  - type: command             # 参考指標（合否に影響しない）: verify が最後の git commit より前に呼ばれたか
    run: '{python} {task_dir}/../../checks/verify_before_commit.py'
    category: process_violation
    description: 参考指標 verify が commit より前
